<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="flex flex-col md:flex-row h-screen overflow-hidden">
    <div
      class="flex flex-col gap-5 bg-gray-200 w-full md:w-[18%] h-screen/2 md:h-screen justify-center items-center p-1"
    >
      <p>Olá <span id="nomeUsuario"> Usuário</span>!</p>
      <img />
      <div class="bg-gray-300 p-3 rounded-sm font-bold">
        Computadores Embarcados
      </div>
      <div>Parâmetros</div>
      <div>Dashboard</div>
      <div>Alertas</div>
      <button onclick="sair()">Sair</button>
    </div>
    <div
      class="flex flex-1 flex-col items-center gap-10 h-screen overflow-y-auto"
    >
      <div
        class="flex items-center flex-row bg-gray-200 justify-between w-[90%] p-3 m-2 rounded-sm"
      >
        <span>Exibindo todos os computadores embarcados da empresa X:</span>
        <button
          class="bg-green-600/50 border-1 border-green-600 p-2 rounded-sm"
          onclick="exibirPainel('painelCRUD', 'Salvar', 'green')"
        >
          Cadastrar novo embarcado
        </button>
      </div>
      <!-- Para a exibição do Read do CRUD, é necessário um for() que percorra todo o retorna da consulta SQL de computador relacionado
         a empresa relacionada ao usuário, para cada resultado, é necessário criar um novo card, criando uma div nova e inserindo o HTML do card.-->
      <!-- Cada card possui esta estrutura abaixo: -->
      <div>
        <div class="flex flex-col gap-3 border-1 p-3">
          <div class="flex flex-row gap-3">
            <div>
              <label for="nomePortico">Nome</label>
              <input type="text" id="nomePortico" name="nomePortico" class="border-1 p-1 rounded-sm"/>
            </div>
            <div>
              <label for="uuidPortico">UUID</label>
              <input type="text" id="uuidPortico" name="uuidPortico" class="border-1 p-1 rounded-sm"/>
            </div>
            <div>
              <label for="codigoPortico">Código</label>
              <input type="text" id="codigoPortico" name="codigoPortico" class="border-1 p-1 rounded-sm"/>
            </div>
            <div>
              <label for="rodoviaPortico">Rodovia</label>
              <input type="text" id="rodoviaPortico" name="rodoviaPortico" class="border-1 p-1 rounded-sm"/>
            </div>
          </div>

          <div class="flex flex-row gap-3">
            <div>
              <label for="kmPortico">KM</label>
              <input type="text" id="kmPortico" name="kmPortico" class="border-1 p-1 rounded-sm"/>
            </div>
            <div>
              <label for="ufPortico">UF</label>
              <input type="text" id="ufPortico" name="ufPortico" class="border-1 p-1 rounded-sm"/>
            </div>
            <div>
              <label for="statusPortico">Status</label>
              <input type="text" id="statusPortico" name="statusPortico" class="border-1 p-1 rounded-sm"/>
            </div>
            <button class="py-1 px-4 bg-green-600 rounded-sm text-white" onclick="filtrarPortico()">Aplicar filtro</button>
          </div>
        </div>
        <div id="container_embarcados"></div>
      </div>
    </div>
    <div
      id="painelCRUD"
      class="flex fixed inset-0 bg-black/50 justify-center items-center flex-col hidden"
    >
      <div class="flex flex-col">
        <div
          class="painel-crud flex flex-col bg-gray-300 h-fit rounded-t-sm pt-3.5 pb-3.5 pr-6.5 pl-6.5 gap-7"
        >
          <div class="flex flex-row justify-between">
            <h5>Preencha as informações do novo embarcado:</h5>
            <button onclick="fecharPainel('painelCRUD')">
              <img src="../assets/x.png" />
            </button>
          </div>
        </div>
        <div
          class="painel-crud flex flex-col bg-gray-200 h-fit p-6.5 gap-7 items-center"
        >
          <div class="flex items-center gap-3">
            <span class="w-20">Nome: </span>
            <input
              id="ipt_nome"
              type="text"
              class="bg-white rounded-sm"
              placeholder="Ex: Computador Embarcado - 01"
            />
          </div>

          <div class="flex items-center gap-3">
            <span class="w-20">UUID:</span>
            <input
              id="ipt_uuid"
              type="text"
              class="bg-white rounded-sm"
              placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
            />
          </div>

          <div class="flex items-center gap-3">
            <span class="w-20">Pórtico: </span>
            <input
              id="ipt_portico"
              type="text"
              class="bg-white rounded-sm"
              placeholder="Ex: XPTO - 99 "
            />
          </div>
          <div class="flex items-center gap-3">
            <span class="w-20">Rodovia: </span>
            <input
              id="ipt_rodovia"
              type="text"
              class="bg-white rounded-sm"
              placeholder="Ex: Rodovia dos Bandeirantes"
            />
          </div>

          <div class="flex items-center gap-3">
            <span class="w-20">KM:</span>
            <input
              id="ipt_km"
              type="number"
              class="bg-white rounded-sm"
              placeholder="Ex: 32.50"
            />
          </div>

          <div class="flex items-center gap-3">
            <span class="w-20">Sentido:</span>
            <select id="sel_sentido" class="bg-white rounded-sm">
              <option disabled selected>Selecione</option>
              <option value="Norte">Norte</option>
              <option value="Sul">Sul</option>
              <option value="Leste">Leste</option>
              <option value="Oeste">Oeste</option>
            </select>
          </div>

          <div class="flex items-center">
            <span class="w-20">UF:</span>
            <select id="sel_uf" class="bg-white rounded-sm">
              <option disabled selected>Selecione</option>
              <option value="AC">AC - Acre</option>
              <option value="AL">AL - Alagoas</option>
              <option value="AP">AP - Amapá</option>
              <option value="AM">AM - Amazonas</option>
              <option value="BA">BA - Bahia</option>
              <option value="CE">CE - Ceará</option>
              <option value="DF">DF - Distrito Federal</option>
              <option value="ES">ES - Espírito Santo</option>
              <option value="GO">GO - Goiás</option>
              <option value="MA">MA - Maranhão</option>
              <option value="MT">MT - Mato Grosso</option>
              <option value="MS">MS - Mato Grosso do Sul</option>
              <option value="MG">MG - Minas Gerais</option>
              <option value="PA">PA - Pará</option>
              <option value="PB">PB - Paraíba</option>
              <option value="PR">PR - Paraná</option>
              <option value="PE">PE - Pernambuco</option>
              <option value="PI">PI - Piauí</option>
              <option value="RJ">RJ - Rio de Janeiro</option>
              <option value="RN">RN - Rio Grande do Norte</option>
              <option value="RS">RS - Rio Grande do Sul</option>
              <option value="RO">RO - Rondônia</option>
              <option value="RR">RR - Roraima</option>
              <option value="SC">SC - Santa Catarina</option>
              <option value="SP">SP - São Paulo</option>
              <option value="SE">SE - Sergipe</option>
              <option value="TO">TO - Tocantins</option>
            </select>
          </div>

          <div class="flex items-center gap-3">
            <span>Status: </span>
            <select
              id="sel_status"
              class="bg-white rounded-sm pt-1.5 pb-1.5 pr-2.5 pl-2.5"
            >
              <option value="1">Ativo</option>
              <option value="0">Inativo</option>
            </select>
          </div>
        </div>
        <div
          class="painel-crud flex flex-col bg-gray-300 h-fit rounded-b-sm pt-3.5 pb-3.5 pr-6.5 pl-6.5 gap-7 justify-center items-center"
        >
          <button
            id="botaoAcao"
            class="w-fit border-1 p-1 rounded-sm"
            onclick="cadastrarPortico()"
          >
            <span id="textoAcao">Salvar</span>
          </button>
        </div>
      </div>
    </div>
    <div
      id="painelDelete"
      class="flex fixed inset-0 bg-black/50 justify-center items-center flex-col hidden"
    >
      <div class="flex flex-col">
        <div
          class="painel-crud flex flex-col bg-gray-300 h-fit rounded-t-sm pt-3.5 pb-3.5 pr-6.5 pl-6.5 gap-7"
        >
          <div class="flex flex-row justify-between">
            <h5>
              Você tem certeza que deseja excluir esse computador embarcado?
            </h5>
            <button onclick="fecharPainel('painelDelete')">
              <img src="../assets/x.png" />
            </button>
          </div>
        </div>
        <div
          class="painel-crud flex flex-col bg-gray-300 h-fit rounded-b-sm pt-3.5 pb-3.5 pr-6.5 pl-6.5 gap-7 justify-center items-center"
        >
          <button
            id="botaoExcluir"
            class="bg-red-600/50 border-red-600 w-fit border-1 p-1 rounded-sm"
            onclick="apagarPortico()"
          >
            Excluir embarcado
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
<script src="../js/dashboard.js"></script>
<script>
  listarPortico();
</script>
